<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fertiplasoft Agenti</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      max-width: 340px;
      width: 100%;
      height: auto;
      margin-bottom: 2.5rem;
    }

    .btn-accedi {
      display: inline-block;
      padding: 14px 48px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #003e7e 0%, #005bb5 100%);
      text-decoration: none;
      border-radius: 8px;
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 62, 126, 0.25);
    }

    .btn-accedi:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 62, 126, 0.35);
    }

    .btn-accedi:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Puoi usare l'immagine PNG salvata nella stessa cartella -->
    <img src="FERTIPLASOFT AGENTI - ANTEPRIMA DI STAMPA.png" alt="Logo Fertiplasoft Agenti" class="logo">
    
    <!-- Link diretto nella stessa finestra per attivare l'apertura automatica della PWA -->
    <a href="https://fertiplasoft.ai.studio/" class="btn-accedi" rel="noopener">Accedi</a>
  </div>

</body>
</html>
